<!-- Admin shell: sidebar + child pages. Guarded by adminGuard. -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="flex flex-col lg:flex-row gap-6">

    <!-- Sidebar -->
    <aside class="lg:w-60 shrink-0">
      <div class="bg-brand-teal-950 rounded-3xl p-5 text-white lg:sticky lg:top-28">
        <div class="flex items-center gap-3 mb-1">
          <div class="w-10 h-10 rounded-xl bg-brand-gold-500/20 border border-brand-gold-500/40 flex items-center justify-center">
            <svg class="w-5 h-5 text-brand-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-extrabold leading-tight">Admin Panel</p>
            <p class="text-[11px] text-slate-400 truncate max-w-[140px]">{{ auth.currentUser()?.email }}</p>
          </div>
        </div>

        <nav class="mt-4 space-y-1">
          @for (item of nav; track item.path) {
            <a [routerLink]="item.path" routerLinkActive="bg-white/10 text-white"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              class="block px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-white/5 hover:text-white transition-colors">
              {{ item.label }}
            </a>
          }
        </nav>

        <div class="mt-4 pt-4 border-t border-white/10 space-y-1">
          <button (click)="viewStore()" type="button"
            class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-white/5 hover:text-white transition-colors">
            View Store
          </button>
          <button (click)="logout()" type="button"
            class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm font-semibold text-rose-300 hover:bg-rose-500/10 transition-colors">
            Logout
          </button>
        </div>
      </div>
    </aside>

    <!-- Page -->
    <div class="flex-1 min-w-0">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
